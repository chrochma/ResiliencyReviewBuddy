<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="Resiliency Review Triage banner">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1f3a"/>
      <stop offset="1" stop-color="#0063b1"/>
    </linearGradient>
    <linearGradient id="shield" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#50e6ff"/>
      <stop offset="1" stop-color="#0078d4"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="300" fill="url(#bg)"/>
  <!-- Faint grid for a console feel -->
  <g stroke="#ffffff" stroke-opacity="0.05">
    <path d="M0 60H1200M0 120H1200M0 180H1200M0 240H1200"/>
    <path d="M100 0V300M200 0V300M300 0V300M400 0V300M500 0V300M600 0V300M700 0V300M800 0V300M900 0V300M1000 0V300M1100 0V300"/>
  </g>
  <!-- Shield with check mark (resiliency) -->
  <g transform="translate(90 55)">
    <path d="M95 0 L190 35 V105 C190 160 150 195 95 215 C40 195 0 160 0 105 V35 Z" fill="url(#shield)"/>
    <path d="M52 108 L84 140 L142 78" fill="none" stroke="#ffffff" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <!-- Title -->
  <text x="330" y="120" font-family="Segoe UI, Arial, sans-serif" font-size="54" font-weight="700" fill="#ffffff">Resiliency Review Triage</text>
  <text x="332" y="162" font-family="Segoe UI, Arial, sans-serif" font-size="24" fill="#cfe8ff">Azure Advisor resiliency reviews · PowerShell TUI</text>
  <!-- Mini TUI mock: status bar -->
  <g transform="translate(332 190)" font-family="Consolas, monospace" font-size="16">
    <rect width="600" height="70" rx="8" fill="#0a1628" fill-opacity="0.85" stroke="#50e6ff" stroke-opacity="0.4"/>
    <text x="16" y="28" fill="#9fb3c8">progress</text>
    <rect x="110" y="15" width="130" height="16" fill="#16c60c"/>
    <rect x="240" y="15" width="70" height="16" fill="#b4a0ff"/>
    <rect x="310" y="15" width="40" height="16" fill="#f9f1a5"/>
    <rect x="350" y="15" width="230" height="16" fill="#3a4a5c"/>
    <text x="16" y="56" fill="#e74856">● Critical</text>
    <text x="130" y="56" fill="#ff8c00">● High</text>
    <text x="215" y="56" fill="#f9f1a5">● Medium</text>
    <text x="320" y="56" fill="#61d6d6">● Low</text>
    <text x="400" y="56" fill="#9fb3c8">Search: zone_</text>
  </g>
</svg>
